    :root {
      --c-primary: #051C2C;
      --c-accent: #051C2C;
      --c-surface: #F2F2F2;
      --c-text: #333333;
      --c-muted: #666666;
      --c-bg: #FFFFFF;
      --c-positive: #2E8B57;
      --c-negative: #C0392B;
      --c-warning: #E67E22;
      --c-line: #CCCCCC;
      --c-series-1: #051C2C;
      --c-series-2: #C0392B;
      --c-series-3: #5B9BD5;
      --c-series-4: #70AD47;
      --c-series-5: #FFC000;
      --c-series-6: #ED7D31;
      --c-series-7: #A5A5A5;
      --c-series-8: #9B59B6;
      --font-display: 'Georgia', 'STSong', 'SimSun', serif;
      --font-body: 'Georgia', 'STSong', 'SimSun', serif;
      --font-mono: 'Consolas', 'Courier New', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      color: var(--c-text);
      background: var(--c-bg);
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }

    /* 鈹€鈹€ 椤堕儴杩涘害鏉?鈹€鈹€ */
    #progress-bar {
      position: fixed; top: 0; left: 0; height: 3px; width: 0%;
      background: var(--c-primary); z-index: 1000; transition: width 0.1s;
    }

    /* 鈹€鈹€ 绮樻€у鑸?鈹€鈹€ */
    .sticky-nav {
      position: sticky; top: 0; z-index: 900;
      background: var(--c-primary); color: #fff;
      display: flex; align-items: center; gap: 4px;
      padding: 0 32px; height: 48px;
      overflow-x: auto; white-space: nowrap;
      box-shadow: 0 1px 0 rgba(0,0,0,0.15);
    }
    .sticky-nav .nav-brand {
      font-weight: 700; font-size: 13px; letter-spacing: 0.5px;
      margin-right: 20px; flex-shrink: 0; opacity: 0.9;
    }
    .sticky-nav a {
      color: rgba(255,255,255,0.65); text-decoration: none;
      font-size: 12px; padding: 14px 12px; flex-shrink: 0;
      border-bottom: 2px solid transparent; transition: all 0.2s;
    }
    .sticky-nav a:hover { color: #fff; }
    .sticky-nav a.active { color: #fff; border-bottom-color: var(--c-series-5); font-weight: 700; }

    /* 鈹€鈹€ 瀹瑰櫒 鈹€鈹€ */
    .rpt-container { max-width: 1126px; margin: 0 auto; padding: 56px 64px 80px; }
    @media (max-width: 899px) { .rpt-container { padding: 32px 20px 60px; } }

    /* 鈹€鈹€ 寮€绡囷細鏋舵瀯钃濆浘寮忓ご閮紙闈炲眳涓環ero锛?鈹€鈹€ */
    .blueprint-header {
      border-left: 6px solid var(--c-primary);
      padding: 8px 0 8px 32px;
      margin-bottom: 48px;
      position: relative;
    }
    .blueprint-header .doc-type {
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 2px;
      color: var(--c-muted); text-transform: uppercase; margin-bottom: 12px;
    }
    .blueprint-header h1 {
      font-family: var(--font-display); font-size: 40px; font-weight: 700;
      color: var(--c-primary); line-height: 1.2; margin-bottom: 12px;
    }
    .blueprint-header .doc-sub {
      font-size: 15px; color: var(--c-muted); max-width: 720px;
    }
    .blueprint-header .doc-meta {
      display: flex; flex-wrap: wrap; gap: 28px; margin-top: 20px;
      font-family: var(--font-mono); font-size: 11px; color: var(--c-muted);
    }
    .blueprint-header .doc-meta b { color: var(--c-primary); }

    /* 鈹€鈹€ 婊氬姩鏄剧幇 鈹€鈹€ */
    .reveal { opacity: 0; transform: translateY(18px); transition: opacity 0.6s ease, transform 0.6s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    /* 鈹€鈹€ 绔犺妭 鈹€鈹€ */
    .rpt-section { margin-bottom: 64px; scroll-margin-top: 64px; }
    .rpt-section > h2 {
      font-family: var(--font-display); font-size: 24px; font-weight: 700;
      color: var(--c-primary); border-bottom: 2px solid var(--c-primary);
      padding-bottom: 12px; margin-bottom: 28px;
      display: flex; align-items: baseline; gap: 12px;
    }
    .rpt-section > h2 .sec-num {
      font-family: var(--font-mono); font-size: 13px; color: var(--c-series-3);
      font-weight: 400; letter-spacing: 1px;
    }
    .rpt-section h3 {
      font-size: 16px; font-weight: 700; color: var(--c-primary);
      margin: 32px 0 14px 0;
    }
    .rpt-section p { font-size: 14px; line-height: 1.9; margin-bottom: 16px; }
    .rpt-section .lead { font-size: 15px; color: var(--c-text); }

    /* 鈹€鈹€ 琛ㄦ牸 鈹€鈹€ */
    .rpt-table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 18px 0; }
    .rpt-table th {
      background: transparent; color: var(--c-text); padding: 10px 12px;
      text-align: left; font-weight: 700; border-bottom: 2px solid var(--c-text);
      font-size: 12px; letter-spacing: 0.3px;
    }
    .rpt-table td { padding: 10px 12px; border-bottom: 1px solid var(--c-line); vertical-align: top; }
    .rpt-table tbody tr { transition: background 0.15s; }
    .rpt-table tbody tr:hover { background: color-mix(in srgb, var(--c-primary) 4%, white); }
    .rpt-table code {
      font-family: var(--font-mono); font-size: 11.5px;
      background: var(--c-surface); padding: 1px 5px; color: var(--c-primary);
    }

    /* 鈹€鈹€ 浠ｇ爜鍧?+ 澶嶅埗鎸夐挳 鈹€鈹€ */
    .code-wrap { position: relative; margin: 18px 0; }
    .code-wrap .code-lang {
      position: absolute; top: 0; right: 0;
      font-family: var(--font-mono); font-size: 10px; letter-spacing: 1px;
      color: rgba(255,255,255,0.4); padding: 8px 14px; text-transform: uppercase;
    }
    .code-wrap .copy-btn {
      position: absolute; top: 6px; right: 70px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.6); font-family: var(--font-mono); font-size: 10px;
      padding: 3px 10px; cursor: pointer; transition: all 0.2s;
    }
    .code-wrap .copy-btn:hover { background: rgba(255,255,255,0.18); color: #fff; }
    .code-block {
      background: #101820; color: #d4d4d4; padding: 22px 26px;
      font-family: var(--font-mono); font-size: 12px; line-height: 1.75;
      overflow-x: auto; white-space: pre;
    }
    .code-block .cm { color: #6a9955; }
    .code-block .kw { color: #569cd6; }
    .code-block .st { color: #ce9178; }
    .code-block .fn { color: #dcdcaa; }
    .code-block .num { color: #b5cea8; }

    /* 鈹€鈹€ 鎻愮ず妗?鈹€鈹€ */
    .callout {
      padding: 18px 22px; margin: 22px 0; border-left: 4px solid var(--c-series-3);
      background: color-mix(in srgb, var(--c-series-3) 6%, white);
      font-size: 13px; line-height: 1.75; transition: border-color 0.2s;
    }
    .callout:hover { border-left-color: var(--c-primary); }
    .callout.tip { border-left-color: var(--c-positive); background: color-mix(in srgb, var(--c-positive) 6%, white); }
    .callout.warning { border-left-color: var(--c-warning); background: color-mix(in srgb, var(--c-warning) 6%, white); }
    .callout.danger { border-left-color: var(--c-negative); background: color-mix(in srgb, var(--c-negative) 6%, white); }
    .callout strong { display: block; margin-bottom: 6px; color: var(--c-primary); font-size: 13px; }

    /* 鈹€鈹€ 妯″潡鍗＄墖锛堥潪鍧囧寑缃戞牸锛屽甫鎺ュ彛濂戠害锛?鈹€鈹€ */
    .module-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 24px 0; }
    @media (max-width: 899px) { .module-grid { grid-template-columns: 1fr; } }
    .module-card {
      border: 1px solid var(--c-line); padding: 0; position: relative;
      transition: border-color 0.2s, transform 0.2s; background: var(--c-bg);
    }
    .module-card:hover { border-color: var(--c-primary); transform: translateY(-2px); }
    .module-card .mc-head {
      background: var(--c-primary); color: #fff; padding: 14px 20px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .module-card .mc-head h4 { font-size: 15px; font-weight: 700; }
    .module-card .mc-head .mc-tag {
      font-family: var(--font-mono); font-size: 10px; letter-spacing: 1px;
      border: 1px solid rgba(255,255,255,0.4); padding: 2px 8px; opacity: 0.8;
    }
    .module-card .mc-body { padding: 18px 20px; }
    .module-card .mc-body p { font-size: 12.5px; margin-bottom: 12px; color: var(--c-text); }
    .module-card .mc-io { font-family: var(--font-mono); font-size: 11px; line-height: 1.9; }
    .module-card .mc-io .io-in { color: var(--c-series-3); }
    .module-card .mc-io .io-out { color: var(--c-positive); }
    .module-card .mc-io .io-dep { color: var(--c-muted); }
    .module-card.full { grid-column: 1 / -1; }

    /* 鈹€鈹€ 鎶樺彔闈㈡澘 鈹€鈹€ */
    details.collapse {
      border: 1px solid var(--c-line); margin: 16px 0; transition: border-color 0.2s;
    }
    details.collapse[open] { border-color: var(--c-primary); }
    details.collapse summary {
      padding: 14px 20px; cursor: pointer; font-size: 13.5px; font-weight: 700;
      color: var(--c-primary); list-style: none; display: flex; align-items: center; gap: 10px;
      transition: background 0.15s; user-select: none;
    }
    details.collapse summary:hover { background: var(--c-surface); }
    details.collapse summary::before {
      content: '鈻?; font-size: 11px; color: var(--c-series-3); transition: transform 0.2s;
    }
    details.collapse[open] summary::before { transform: rotate(90deg); }
    details.collapse .collapse-body { padding: 6px 20px 20px; }

    /* 鈹€鈹€ Tabs 鈹€鈹€ */
    .rpt-tabs { display: flex; flex-wrap: wrap; gap: 28px; margin: 28px 0 24px; border-bottom: 1px solid var(--c-line); }
    .rpt-tab-btn {
      background: transparent; border: none; color: var(--c-muted); padding: 12px 0;
      cursor: pointer; font-size: 13.5px; font-family: inherit; margin-bottom: -1px; transition: color 0.2s;
    }
    .rpt-tab-btn:hover { color: var(--c-text); }
    .rpt-tab-btn.active { color: var(--c-primary); border-bottom: 2px solid var(--c-primary); font-weight: 700; }
    .rpt-tab-content { display: none; animation: fadeIn 0.3s ease; }
    .rpt-tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* 鈹€鈹€ 鍥捐〃瀹瑰櫒 鈹€鈹€ */
    .chart-container { width: 100%; height: 460px; margin: 24px 0; }
    .chart-container.tall { height: 560px; }
    .chart-container.short { height: 360px; }

    /* 鈹€鈹€ 澶ф暟瀛楃粺璁¤锛堝甫璁℃暟鍔ㄧ敾锛?鈹€鈹€ */
    .stat-strip {
      display: flex; gap: 0; margin: 32px 0 40px; border-top: 2px solid var(--c-primary);
      border-bottom: 1px solid var(--c-line);
    }
    .stat-strip .stat-item {
      flex: 1; padding: 24px 20px 20px; border-right: 1px solid var(--c-line);
      transition: background 0.2s;
    }
    .stat-strip .stat-item:last-child { border-right: none; }
    .stat-strip .stat-item:hover { background: var(--c-surface); }
    .stat-strip .stat-num {
      font-family: var(--font-display); font-size: 38px; font-weight: 700;
      color: var(--c-primary); line-height: 1.1;
    }
    .stat-strip .stat-num .unit { font-size: 16px; font-weight: 400; color: var(--c-muted); margin-left: 2px; }
    .stat-strip .stat-lbl { font-size: 11.5px; color: var(--c-muted); margin-top: 6px; letter-spacing: 0.3px; }
    @media (max-width: 899px) { .stat-strip { flex-wrap: wrap; } .stat-strip .stat-item { flex: 1 1 45%; border-bottom: 1px solid var(--c-line); } }

    /* 鈹€鈹€ 鎺ュ彛濂戠害寰界珷 鈹€鈹€ */
    .badge-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .badge {
      font-family: var(--font-mono); font-size: 10.5px; padding: 3px 10px;
      border: 1px solid var(--c-line); color: var(--c-muted); letter-spacing: 0.5px;
      transition: all 0.2s; cursor: default;
    }
    .badge:hover { border-color: var(--c-primary); color: var(--c-primary); }
    .badge.in { border-color: var(--c-series-3); color: var(--c-series-3); }
    .badge.out { border-color: var(--c-positive); color: var(--c-positive); }

    /* 鈹€鈹€ 鍒嗗眰鏋舵瀯鏉?鈹€鈹€ */
    .layer-stack { margin: 28px 0; }
    .layer-row {
      display: flex; align-items: stretch; margin-bottom: 6px;
      transition: transform 0.2s; cursor: default;
    }
    .layer-row:hover { transform: translateX(6px); }
    .layer-row .layer-tag {
      width: 110px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: #fff;
      letter-spacing: 1px;
    }
    .layer-row .layer-body {
      flex: 1; border: 1px solid var(--c-line); border-left: none;
      padding: 14px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    .layer-row .layer-body .lb-title { font-size: 13.5px; font-weight: 700; color: var(--c-primary); }
    .layer-row .layer-body .lb-desc { font-size: 12px; color: var(--c-muted); }

      font-family: var(--font-mono); font-size: 10px; background: var(--c-surface);
      padding: 2px 8px; color: var(--c-text);
    }

    /* 鈹€鈹€ 椤佃剼 鈹€鈹€ */
    .rpt-footer {
      border-top: 2px solid var(--c-primary); padding-top: 24px; margin-top: 72px;
      display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px;
      font-family: var(--font-mono); font-size: 11px; color: var(--c-muted);
    }

    /* 鈹€鈹€ 閿氱偣閾炬帴鏍峰紡 鈹€鈹€ */
    a.inline-link { color: var(--c-primary); text-decoration: underline; text-underline-offset: 3px; }

var revealObs = new IntersectionObserver(function(entries) {
  entries.forEach(function(e) {
    if (e.isIntersecting) { e.target.classList.add('visible'); revealObs.unobserve(e.target); }
  });
}, { threshold: 0.08 });
document.querySelectorAll('.reveal').forEach(function(el) { revealObs.observe(el); });

/* 鈺愨晲鈺?鏁板瓧璁℃暟鍔ㄧ敾 鈺愨晲鈺?*/
var counterObs = new IntersectionObserver(function(entries) {
  entries.forEach(function(e) {
    if (!e.isIntersecting) return;
    var el = e.target, target = +el.dataset.target, t0 = null;
    function step(ts) {
      if (!t0) t0 = ts;
      var p = Math.min((ts - t0) / 900, 1);
      el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
    counterObs.unobserve(el);
  });
}, { threshold: 0.5 });
document.querySelectorAll('.counter').forEach(function(el) { counterObs.observe(el); });

  entries.forEach(function(e) {
    if (e.isIntersecting) {
      navLinks.forEach(function(a) {
        a.classList.toggle('active', a.getAttribute('href') === '#' + e.target.id);
      });
    }
  });
}, { rootMargin: '-20% 0px -70% 0px' });
sections.forEach(function(s) { if (s) spyObs.observe(s); });
